name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  oraculo:
    name: Oráculo (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # la CI usa otra versión que el desarrollo a propósito: detecta dependencias de versión
      - run: pip install -r oracle/requirements.txt
      - name: Pruebas del oráculo
        run: python -m pytest oracle -q
      - name: Los vectores guardados coinciden con los que genera el oráculo
        run: python oracle/generar_vectores.py --verificar

  motor:
    name: Motor (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (motor + interfaz con svelte-check)
        run: pnpm typecheck
      - run: pnpm lint
      - name: Pruebas + cobertura (umbral 95 %)
        run: pnpm coverage
      - name: Build de la interfaz
        run: pnpm build

  interfaz:
    name: Interfaz (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Navegadores de Playwright
        run: pnpm --filter @dw/app exec playwright install --with-deps chromium firefox webkit
      - name: End-to-end (3 motores × 360/768/1920 px)
        run: pnpm --filter @dw/app e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 14

  visual:
    name: Regresión visual (Linux)
    # Versión fija: otra versión de Ubuntu dibuja las fuentes distinto y rompería todas las capturas (D-22).
    runs-on: ubuntu-24.04
    # Puede commitear en main las capturas de referencia de Linux que falten (D-20).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium de Playwright
        run: pnpm --filter @dw/app exec playwright install --with-deps chromium
      # Pasada 1: solo escribe las capturas de Linux que falten (nunca pisa las existentes).
      # Playwright marca como falla la captura que escribe por primera vez: por eso "|| true".
      - name: Crear las capturas de Linux que falten
        run: pnpm --filter @dw/app e2e:visual --update-snapshots=missing || true
      - name: Guardar en main las capturas nuevas
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add app/e2e/visual/capturas
          if git diff --cached --quiet; then
            echo "No hay capturas nuevas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Capturas de referencia de Linux para la regresión visual (D-20)"
          git push
      # Pasada 2: comparación estricta contra las capturas guardadas.
      - name: Comparar capturas claro/oscuro a 360 y 1920 px
        run: pnpm --filter @dw/app e2e:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regresion-visual
          path: |
            app/playwright-report-visual
            app/test-results
          retention-days: 14

  lighthouse:
    name: Lighthouse (accesibilidad y buenas prácticas ≥ 95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lighthouse CI (informes locales, no se suben a ningún servidor)
        working-directory: app
        run: pnpm dlx @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: app/lighthouse
          retention-days: 14
