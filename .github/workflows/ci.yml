name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  oraculo:
    name: Oráculo (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # la CI usa otra versión que el desarrollo a propósito: detecta dependencias de versión
      - run: pip install -r oracle/requirements.txt
      - name: Pruebas del oráculo
        run: python -m pytest oracle -q
      - name: Los vectores guardados coinciden con los que genera el oráculo
        run: python oracle/generar_vectores.py --verificar

  motor:
    name: Motor (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (motor + interfaz con svelte-check)
        run: pnpm typecheck
      - run: pnpm lint
      - name: Pruebas + cobertura (umbral 95 %)
        run: pnpm coverage
      - name: Build de la interfaz
        run: pnpm build
